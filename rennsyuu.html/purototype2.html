<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            margin: 0;
            overflow-x: hidden;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
        }

        .glass-dark {
             background: rgba(236, 238, 240, 0.6); /* surface-container */
             backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
             border-top: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Ambient Background Gradient */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(124, 185, 232, 0.15) 0%, transparent 50%), /* primary-container */
                        radial-gradient(circle at 80% 70%, rgba(171, 236, 223, 0.15) 0%, transparent 50%); /* secondary-container */
            filter: blur(60px);
        }

        /* Ripple Animations */
        @keyframes ripple-expand {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .drop-btn {
            position: relative;
            overflow: hidden;
        }
        
        .drop-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .drop-btn:active::after {
            animation: ripple-expand 0.6s ease-out;
        }
        
        /* Floating Circles */
        .floating-circle {
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-circle:nth-child(2) { animation-delay: -1s; }
        .floating-circle:nth-child(3) { animation-delay: -2s; }
        .floating-circle:nth-child(4) { animation-delay: -3s; }
        .floating-circle:nth-child(5) { animation-delay: -4s; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        
        /* Depth Stacking */
        .depth-stack img {
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 12px rgba(28, 100, 142, 0.1);
            transition: transform 0.3s ease, z-index 0s;
        }
        
        .depth-stack img:hover {
            transform: scale(1.1) translateY(-5px);
            z-index: 10;
        }
    </style>
