<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Presence - 自己紹介の作成</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "on-secondary-container": "#2c6d63",
                            "on-tertiary-fixed": "#281716",
                            "surface-container-high": "#e6e8ea",
                            "on-tertiary-container": "#55403e",
                            "background": "#f7f9fb",

                            "surface-bright": "#f7f9fb",
                            "on-primary": "#ffffff",
                            "on-tertiary": "#ffffff",
                            "secondary": "#27695e",
                            "surface-container-low": "#f2f4f6",
                            "surface-container": "#eceef0",
                            "on-tertiary-fixed-variant": "#574240",
                            "error": "#ba1a1a",
                            "on-primary-fixed": "#001e30",
                            "surface-dim": "#d8dadc",
                            "primary-container": "#7cb9e8",
                            "on-primary-container": "#00496d",
                            "primary": "#1c648e",
                            "primary-fixed": "#cae6ff",
                            "surface-tint": "#1c648e",
                            "tertiary": "#705957",
                            "inverse-primary": "#90cdfd",
                            "on-secondary-fixed-variant": "#015047",
                            "on-secondary": "#ffffff",
                            "on-error": "#ffffff",
                            "on-surface": "#191c1e",
                            "on-surface-variant": "#41484e",
                            "tertiary-fixed-dim": "#ddc0bd",

                            "surface-container-lowest": "#ffffff",
                            "surface-variant": "#e0e3e5",
                            "secondary-fixed": "#aeefe2",
                            "tertiary-container": "#c9aca9",
                            "inverse-on-surface": "#eff1f3",
                            "error-container": "#ffdad6",
                            "secondary-fixed-dim": "#92d3c6",
                            "outline-variant": "#c0c7cf",
                            "secondary-container": "#abecdf",
                            "tertiary-fixed": "#fadbd8",
                            "surface-container-highest": "#e0e3e5",
                            "on-background": "#191c1e",
                            "primary-fixed-dim": "#90cdfd",
                            "on-secondary-fixed": "#00201c",
                            "on-error-container": "#93000a",
                            "inverse-surface": "#2d3133"
                    },
                    "borderRadius": {
                            "DEFAULT": "1rem",
                            "lg": "2rem",
                            "xl": "3rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "xs": "4px",
                            "xl": "80px",
                            "md": "24px",
                            "base": "8px",
                            "lg": "48px",
                            "margin": "64px",
                            "sm": "12px",
                            "gutter": "24px"
                    },
                    "fontFamily": {
                            "body-lg": ["Plus Jakarta Sans"],
                            "display-lg": ["Plus Jakarta Sans"],

                            "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}]

<style>
        body {
            background-color: #f7f9fb;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(202, 230, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(171, 236, 223, 0.4) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(28, 100, 142, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(28, 100, 142, 0.3);
            box-shadow: 0 0 0 4px rgba(28, 100, 142, 0.1);
            background: rgba(255, 255, 255, 0.8);
        }

        .btn-primary {
            background: linear-gradient(135deg, #1c648e 0%, #27695e 100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(28, 100, 142, 0.5);
            background: linear-gradient(135deg, #00496d 0%, #015047 100%);
        }

        .progress-dot {
            transition: all 0.5s ease;
        }
        
        .progress-dot.active {
            background-color: #1c648e;
            transform: scale(1.2);
            box-shadow: 0 0 12px rgba(28, 100, 142, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-gutter md:p-margin text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
<!-- Decorative background elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-[-1]">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary-fixed opacity-30 blur-3xl mix-blend-multiply animate-[pulse_8s_ease-in-out_infinite]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container opacity-30 blur-3xl mix-blend-multiply animate-[pulse_10s_ease-in-out_infinite_reverse]"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-2xl mx-auto flex flex-col relative z-10 animate-[fadeIn_1s_ease-out]">
<!-- Header -->
<header class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent mb-sm">
                Presence
            </h1>
<p class="font-label-md text-label-md text-on-surface-variant tracking-wider">
                Gentle Connectivity
            </p>
</header>
<!-- Content Card -->
<div class="glass-panel rounded-xl p-lg md:p-margin flex flex-col gap-lg">
<!-- Progress Indicator -->
<div aria-label="Progress: Step 2 of 2" class="flex justify-center items-center gap-sm">
<div class="w-2 h-2 rounded-full bg-outline-variant progress-dot"></div>
<div class="w-8 h-[2px] bg-outline-variant/30 rounded-full"></div>
<div class="w-2 h-2 rounded-full bg-primary progress-dot active"></div>
</div>
<!-- Titles -->
<div class="text-center flex flex-col gap-md">
<h2 class="font-headline-lg text-headline-lg text-on-surface">自己紹介の作成</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-lg mx-auto">
                    あなたの言葉を水滴に乗せて。この自己紹介は、最初のログイン時に全てのコミュニティへ届けられます。
                </p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-lg" method="POST" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
<div class="flex flex-col gap-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant ml-4" for="bio">
                        自己紹介の定型文
                    </label>
<div class="relative group">
<textarea class="glass-input w-full rounded-lg py-md px-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant resize-none" id="bio" name="bio" placeholder="趣味のこと、最近興味があることなど、自由に書いてみましょう。" required="" rows="6"></textarea>
<!-- Decorative ripple effect placeholder for input focus -->
<div class="absolute inset-0 rounded-lg border border-primary/0 group-focus-within:border-primary/20 pointer-events-none transition-colors duration-500"></div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col items-center gap-md mt-md">
<button class="btn-primary w-full md:w-auto min-w-[240px] flex items-center justify-center gap-sm text-on-primary font-label-md text-label-md py-4 px-xl rounded-full relative overflow-hidden group" type="submit">
<span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:scale-110" data-weight="fill" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span>Presence を始める</span>
<!-- Button ripple overlay -->
<div class="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition-colors duration-300"></div>
</button>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors py-2 px-4 rounded-full hover:bg-surface-variant/30" onclick="window.history.back()" type="button">
                        戻る
                    </button>
</div>
</form>
</div>
</main>
</body></html>
