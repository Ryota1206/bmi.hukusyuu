<style>
        body {
            background-color: #f7f9fb;
            background-image: 
                radial-gradient(at 0% 0%, hsla(205,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(205,100%,94%,1) 0, transparent 50%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 15px rgba(28, 100, 142, 0.1);
            outline: none;
        }

        .ripple-btn {
            background: linear-gradient(135deg, var(--color-primary, #1c648e), var(--color-secondary, #27695e));
            transition: all 0.3s ease;
        }
        
        .ripple-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(28, 100, 142, 0.2);
        }
      </style>

<body class="flex items-center justify-center p-gutter font-body-md text-on-surface">
<main class="w-full max-w-md">
<!-- Logo Area -->
<div class="text-center mb-lg">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight flex items-center justify-center gap-base">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 40px;">water_drop</span>
                Presence
            </h1>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-lg relative overflow-hidden">
<div class="text-center mb-md relative z-10">
<h2 class="font-headline-lg text-headline-lg text-on-surface">おかえりなさい</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">アカウント情報を入力してください</p>
</div>
<form class="space-y-md relative z-10">
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface ml-base" for="email">メールアドレス</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="glass-input w-full rounded-full py-md pl-[56px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="hello@presence.app" type="email"/>
</div>
</div>
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface ml-base" for="password">パスワード</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="glass-input w-full rounded-full py-md pl-[56px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-sm">
<button class="ripple-btn w-full rounded-full py-md font-label-md text-label-md text-on-primary shadow-sm hover:backdrop-blur-xl" type="submit">
                        ログイン
                    </button>
</div>
</form>
<!-- Links -->
<div class="mt-lg flex flex-col items-center gap-sm relative z-10">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-variant transition-colors" href="#">パスワードをお忘れの方</a>
<span class="text-on-surface-variant/20">|</span>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-fixed-dim transition-colors" href="#">新しくアカウントを作成する</a>
</div>
<!-- Decorative Background Element inside Card -->
<div class="absolute -bottom-20 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
</div>
</main>
</body></html>
