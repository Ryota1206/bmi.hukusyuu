<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Presence - 新しく始める</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eceef0",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#00201c",
                        "on-surface-variant": "#41484e",
                        "on-primary-container": "#00496d",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary": "#27695e",
                        "on-tertiary-container": "#55403e",
                        "inverse-surface": "#2d3133",
                        "on-secondary-container": "#2c6d63",
                        "secondary-container": "#abecdf",
                        "surface-container-low": "#f2f4f6",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "on-error": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "on-surface": "#191c1e",
                        "outline-variant": "#c0c7cf",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eff1f3",
                        "surface": "#f7f9fb",
                        "tertiary-fixed": "#fadbd8",
                        "surface-bright": "#f7f9fb",
                        "tertiary-container": "#c9aca9",
                        "on-background": "#191c1e",
                        "primary-container": "#7cb9e8",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#015047",
                        "secondary-fixed-dim": "#92d3c6",
                        "on-primary-fixed": "#001e30",
                        "on-tertiary-fixed-variant": "#574240",
                        "primary-fixed-dim": "#90cdfd",
                        "on-tertiary-fixed": "#281716",
                        "on-primary-fixed-variant": "#004b70",
                        "surface-tint": "#1c648e",
                        "tertiary": "#705957",
                        "background": "#f7f9fb",
                        "secondary-fixed": "#aeefe2",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#90cdfd",
                        "surface-variant": "#e0e3e5",
                        "outline": "#71787f",
                        "primary-fixed": "#cae6ff",
                        "error": "#ba1a1a",
                        "primary": "#1c648e",
                        "tertiary-fixed-dim": "#ddc0bd"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",

                        "xs": "4px"
                    },
                    "fontFamily": {

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(28, 100, 142, 0.05);
        }
        
        .ripple-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #f7f9fb 0%, #cae6ff 50%, #abecdf 100%);
        }
        
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            animation: float 20s infinite ease-in-out;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-50px) scale(1.1); }
        }

        .input-glow:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(124, 185, 232, 0.3);
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center relative font-body-md">
<!-- Ambient Background -->
<div class="ripple-bg">
<div class="ripple-circle" style="width: 800px; height: 800px; top: -200px; left: -200px; animation-delay: 0s;"></div>
<div class="ripple-circle" style="width: 600px; height: 600px; bottom: -100px; right: -100px; animation-delay: -5s;"></div>
<div class="ripple-circle" style="width: 400px; height: 400px; top: 30%; left: 40%; animation-delay: -10s; opacity: 0.4;"></div>
</div>
<!-- Main Registration Card -->
<main class="w-full max-w-[480px] p-gutter mx-auto relative z-10">
<div class="glass-panel rounded-xl p-lg flex flex-col gap-md">
<!-- Header -->
<div class="text-center mb-sm">
<div class="flex justify-center items-center mb-base">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="water_drop">water_drop</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-xs">新しく始める</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Presenceへようこそ。あなたの居場所をつくりましょう。</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-base" for="name">名前</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full bg-surface-container-lowest/50 border-none rounded-full py-sm pl-[44px] pr-sm text-on-surface placeholder:text-outline-variant transition-all input-glow font-body-md text-body-md" id="name" placeholder="山田 太郎" type="text"/>
</div>
</div>
<!-- Nickname -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-base" for="nickname">ニックネーム (呼ばれたい名前)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="face">face</span>
<input class="w-full bg-surface-container-lowest/50 border-none rounded-full py-sm pl-[44px] pr-sm text-on-surface placeholder:text-outline-variant transition-all input-glow font-body-md text-body-md" id="nickname" placeholder="タロウ" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-base" for="email">メールアドレス</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest/50 border-none rounded-full py-sm pl-[44px] pr-sm text-on-surface placeholder:text-outline-variant transition-all input-glow font-body-md text-body-md" id="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-base" for="password">パスワード</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest/50 border-none rounded-full py-sm pl-[44px] pr-sm text-on-surface placeholder:text-outline-variant transition-all input-glow font-body-md text-body-md" id="password" placeholder="8文字以上" type="password"/>
</div>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-base" for="dob">生年月日</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="calendar_month">calendar_month</span>
<input class="w-full bg-surface-container-lowest/50 border-none rounded-full py-sm pl-[44px] pr-sm text-on-surface text-on-surface-variant transition-all input-glow font-body-md text-body-md cursor-pointer" id="dob" type="date"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-gradient-to-r from-primary to-secondary text-on-primary font-label-md text-label-md py-[16px] rounded-full hover:scale-[1.02] transition-transform duration-300 shadow-md shadow-primary/20 flex items-center justify-center gap-base" type="button">
                        次へ (自己紹介の作成)
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-base text-center">
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors inline-flex items-center gap-xs" href="#">
                    既にアカウントをお持ちの方はこちら (ログイン)
                </a>
</div>
</div>
</main>
<script>
        // Simple ripple effect for the button
        document.querySelector('button').addEventListener('click', function (e) {
            let ripple = document.createElement('span');
            this.appendChild(ripple);
            let x = e.clientX - e.target.offsetLeft;
            let y = e.clientY - e.target.offsetTop;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            setTimeout(() => {
                ripple.remove();
            }, 300);
        });
    </script>
</body></html>
