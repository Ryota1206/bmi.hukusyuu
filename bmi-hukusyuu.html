<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BMIを計算しよう</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-white-100 flex items-center justify-center min-h-screen bg-[url('./image/image.png')]">
        <div class="bg-white rounded-lg shadow mx-auto">
            <h1 class="text-2xl font-bold mb-6">BMI計算（やせすぎ太りすぎは健康が心配だ！）</h1>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">身長（cm）</label>
                <input id="weight" type="number" placeholder="170"
                class="w-full border border-gray-300 rounded px-3 py-2">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">体重 (kg)</label>
            <input id="weight" type="number" placeholder="例：65"
        class="w-full border border-gray-300 rounded px-3 py-2">
        </div>

        <button id="calcBtn"
        class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
        計算する
        </button>

        <p id="result" class="mt-6 text-center text-lg font-bold text-gray-800"></p>
    </div>

            </div>
        </div>
    </div>
    <script>
        function calcBmi(height, weight){
            const heightM = height/100;
            return weight /(heightM*heightM)
        }
        function getJudgement(bmi){
            if (bmi<18.5){
                return"やせ型 太ったほうがいいよ 将来が心配"
            }else if(bmi<25){
                return "普通だね 筋肉付けたほうがいい"
            }
          return "肥満";
        }

      const button = document.querySelector("#calcBtn");
      const result = document.querySelector("#result");

      button.addEventListener("click", () => {
        const height = Number(document.querySelector("#height").value);
        const weight = Number(document.querySelector("#weight").value);

        if (height <= 0 || weight <= 0) {
          result.textContent = "身長と体重を入力してください";
          return;
        }

        const bmi = calcBmi(height, weight);
        const judgment = getJudgment(bmi);

        result.textContent = "BMI: " + bmi.toFixed(1) + "（" + judgment + "）";
      });

    </script>
    </body>
</html>
